<!doctype html>
<html lang="zh-Hans">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if register %}注册{% else %}登录{% endif %} · 澳門漫遊</title>
    <style>
        * {box-sizing: border-box;}

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f5f4ef;
            font-family: Arial, sans-serif;
            color: #294b3d;
        }

        .account-card {
            width: min(440px, 92%);
            padding: 36px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px #0000000d;
        }

        h1 {
            margin-bottom: 24px;
        }

        input {
            max-width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #315d4b;
            color: white;
            border: 0;
            border-radius: 7px;
            cursor: pointer;
        }

        a {
            color: #315d4b;
        }

        .errorlist {
            color: #b33c35;
        }
    </style>
</head>

<body>
    <main class="account-card">
        <p>MACAO CULTURAL GUIDE</p>

        <h1>
            {% if register %}创建账号{% else %}登录账号{% endif %}
        </h1>

        <form method="post">
            {% csrf_token %}

            {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            {{ form.non_field_errors }}
            {{ form.as_div }}

            <button type="submit">
                {% if register %}注册{% else %}登录{% endif %}
            </button>
        </form>

        {% if register %}
        <p>已有账号？ <a href="{% url 'login' %}">前往登录</a></p>
        {% else %}
        <p>还没有账号？ <a href="{% url 'register' %}">立即注册</a></p>
        {% endif %}

        <a href="http://127.0.0.1:5173/">返回首页</a>
    </main>
</body>

</html>
